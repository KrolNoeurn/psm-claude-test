server {
    listen 80;
    client_max_body_size 10m;

    location /api/    { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /admin/  { proxy_pass http://backend:8000; proxy_set_header Host $host; }
    location /static/ { proxy_pass http://backend:8000; }
    location /media/  { proxy_pass http://backend:8000; }

    # Vue Router uses HTML5 history mode.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
